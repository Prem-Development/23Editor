
name: editor_23
description: "23Editor - Your footage. Your story."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  video_player: ^2.10.1
  record: ^6.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ====================================
# 23 EDITOR APP LOGO CONFIGURATION
# ====================================

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# ====================================
# FLUTTER SETTINGS
# ====================================

flutter:
  uses-material-design: true
